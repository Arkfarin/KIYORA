[package]
name = "kiyora"
version = "0.1.0"
description = "kiyora — personal Telegram music vault"
authors = ["you"]
edition = "2024"

[workspace]
resolver = "3"
members = [".", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs", "io-util", "test-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
vault-domain = { path = "crates/vault-domain" }
vault-protocol = { path = "crates/vault-protocol" }
vault-db = { path = "crates/vault-db" }
vault-telegram = { path = "crates/vault-telegram" }
vault-security = { path = "crates/vault-security" }
vault-testkit = { path = "crates/vault-testkit" }
vault-snapshot = { path = "crates/vault-snapshot" }
vault-sync = { path = "crates/vault-sync" }
vault-core = { path = "crates/vault-core" }
vault-media = { path = "crates/vault-media" }
rpassword = "7"
zstd = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kiyora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vault-core.workspace = true
vault-domain.workspace = true
vault-db.workspace = true
vault-telegram.workspace = true
tokio-util.workspace = true
tokio.workspace = true
uuid.workspace = true
zeroize = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
